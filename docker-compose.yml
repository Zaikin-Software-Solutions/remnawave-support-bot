# Production compose: pulls the prebuilt multi-arch image from GHCR.
# For local development with rebuild-on-change, use:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  support-bot:
    image: ghcr.io/zaikin-software-solutions/remnawave-support-bot:latest
    container_name: remnawave-support-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    # Если нужно ходить в Remnawave API во внутренней docker-сети панели —
    # раскомментируйте и подставьте имя сети из docker-compose Remnawave.
    # networks:
    #   - remnawave

# networks:
#   remnawave:
#     external: true
