[project]
name = "remnawave-support-bot"
version = "0.1.0"
description = "Telegram support bot for Remnawave VPN panel: forwards user messages to owner with subscription context."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.27,<4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
